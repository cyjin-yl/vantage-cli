name: CI

on:
  push:
    branches: [main, work/vantage-implementation]
  pull_request:

permissions:
  contents: read

# This runner covers Linux only. Native Windows builds require a separate
# Windows runner; neither cross-compilation nor Windows smoke is claimed here.
# The locally installed image and action runtimes are preseeded; no external
# action resolution or toolchain/registry downloads are required by these steps.
jobs:
  test:
    runs-on: vantage
    timeout-minutes: 60
    container:
      image: vantage-ci-job:latest
      options: --cpus=4 --memory=8g --memory-swap=8g --pids-limit=512
      volumes:
        - /tank/docker/doescontainer/binds/vantage-runner/cargo-target:/usr/local/cargo-target
        - /tank/docker/doescontainer/binds/vantage-runner/ci-actions:/opt/vantage-ci-actions:ro
    steps:
      - name: Check out exact source commit
        # The image has Node but no git. Execute the preseeded checkout
        # runtime directly so its REST archive fallback needs no bootstrap
        # checkout, remote action resolution or additional dependencies.
        # Only Gitea's repository-scoped job token is supplied.
        env:
          INPUT_TOKEN: ${{ github.token }}
          INPUT_REPOSITORY: ${{ github.repository }}
          INPUT_REF: ${{ github.sha }}
          INPUT_PATH: '.'
          INPUT_FETCH-DEPTH: '1'
          INPUT_PERSIST-CREDENTIALS: 'false'
          INPUT_SET-SAFE-DIRECTORY: 'false'
          INPUT_SUBMODULES: 'false'
          INPUT_LFS: 'false'
          # Empty intentionally: checkout then uses the runner-provided
          # GITHUB_API_URL instead of deriving a GitHub Enterprise URL.
          INPUT_GITHUB-SERVER-URL: ''
        run: |
          set +x
          cd /opt/vantage-ci-actions
          sha256sum --check SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          node /opt/vantage-ci-actions/checkout/dist/index.js
      - name: Prepare preseeded artifact uploader
        run: |
          cd /opt/vantage-ci-actions
          sha256sum --check SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          mkdir -p ci-runtime
          cp -R /opt/vantage-ci-actions/upload-artifact ci-runtime/upload-artifact
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --locked --offline --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --locked --offline --workspace --all-targets
      - name: Build release binaries
        run: cargo build --locked --offline --release --workspace
      - name: Collect release binaries
        run: |
          mkdir -p ci-runtime/release
          for binary in vantage vantaged vantage-gui; do
            cp "$CARGO_TARGET_DIR/release/$binary" "ci-runtime/release/$binary"
          done
      - name: Upload release binaries
        # Preseeded upload-artifact v3, compatible with Gitea's artifact API.
        uses: ./ci-runtime/upload-artifact
        with:
          name: vantage-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            ci-runtime/release/vantage
            ci-runtime/release/vantaged
            ci-runtime/release/vantage-gui
    env:
      RUSTFLAGS: -Dwarnings
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
      CARGO_TARGET_DIR: /usr/local/cargo-target
      CARGO_NET_OFFLINE: 'true'
      CARGO_BUILD_JOBS: '4'
