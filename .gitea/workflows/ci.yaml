name: CI

on:
  push:
    branches: [main, work/vantage-implementation]
  pull_request:

permissions:
  contents: read

# The internal runner executes Linux jobs only: the Docker engine on this
# host is Linux and carries no Windows container image, so a Windows job
# could not build here. The Windows lane stays on the GitHub workflow in
# .github/workflows/ci.yml, and the target-machine smoke test runs on the
# 21VG host.
#
# The job image carries the Rust toolchain and the native build
# dependencies, so a run does not depend on downloading them.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: vantage
    timeout-minutes: 60
    container:
      image: vantage-ci-job:latest
    steps:
      # The action repositories are mirrored into this Gitea instance: the
      # network has no route to GitHub and the proxy budget is limited.
      - uses: ezra/checkout@v4
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Build release binaries
        run: cargo build --release --workspace
      - name: Collect release binaries
        # cargo writes into the persistent cache directory, not into the
        # workspace, so bring the artefacts back before uploading them.
        run: |
          mkdir -p target
          cp -a "$CARGO_TARGET_DIR/release/." target/release/
      - name: Upload release binaries
        # Gitea 1.27 rejects upload-artifact v4, which targets the GitHub
        # Enterprise artifact API. Version 3 is the supported one here.
        uses: ezra/upload-artifact@v3
        with:
          name: vantage-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            target/release/vantage
            target/release/vantage.exe
            target/release/vantaged
            target/release/vantaged.exe
            target/release/vantage-gui
            target/release/vantage-gui.exe
    env:
      RUSTFLAGS: -Dwarnings
      # Reuse the compiled artefacts from earlier runs instead of rebuilding
      # the whole dependency tree on every push.
      CARGO_TARGET_DIR: /usr/local/cargo-target
