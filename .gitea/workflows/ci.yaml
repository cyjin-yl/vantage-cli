name: CI

on:
  push:
    branches: [main, work/vantage-implementation]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: vantage
    timeout-minutes: 60
    container:
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "windows host toolchain"
          else
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl gcc pkg-config
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            "$HOME/.cargo/bin/rustup" component add rustfmt clippy
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          fi
      - name: Install GPUI native dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Build release binaries
        run: cargo build --release --workspace
      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: vantage-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            target/release/vantage
            target/release/vantage.exe
            target/release/vantaged
            target/release/vantaged.exe
            target/release/vantage-gui
            target/release/vantage-gui.exe
    env:
      RUSTFLAGS: -Dwarnings
