name: CI

on:
  push:
    branches: [main, work/vantage-implementation]
  pull_request:

permissions:
  contents: read

# The internal runner executes Linux jobs only: the Docker engine on this
# host is Linux and carries no Windows container image, so a Windows job
# could not build here. The Windows lane stays on the GitHub workflow in
# .github/workflows/ci.yml, and the target-machine smoke test runs on the
# 21VG host.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: vantage
    timeout-minutes: 60
    container:
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gcc pkg-config
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          "$HOME/.cargo/bin/rustup" component add rustfmt clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
      - name: Install GPUI native dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Build release binaries
        run: cargo build --release --workspace
      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: vantage-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            target/release/vantage
            target/release/vantage.exe
            target/release/vantaged
            target/release/vantaged.exe
            target/release/vantage-gui
            target/release/vantage-gui.exe
    env:
      RUSTFLAGS: -Dwarnings
