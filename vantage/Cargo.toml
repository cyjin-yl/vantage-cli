[package]
name = "vantage-cli"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
repository.workspace = true
homepage = "https://github.com/cyjin-yl/vantage-cli"
description = "Cross-platform Lenovo hardware control CLI"
license = "AGPL-3.0-only"

[[bin]]
name = "vantage"
path = "src/main.rs"


[dependencies]
clap = { version = "4", features = ["derive"] }
vantage-daemon = { path = "../crates/vantage-daemon", version = "1.0.0" }
vantage-cli-lib = { path = "../crates/vantage-cli", version = "1.0.0" }
lctrl-core = { path = "../crates/lctrl-core", version = "1.0.0" }
lctrl-hal = { path = "../crates/lctrl-hal", version = "1.0.0" }
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
lctrl-hal-linux = { path = "../crates/lctrl-hal-linux", version = "1.0.0" }

[target.'cfg(windows)'.dependencies]
lctrl-hal-win = { path = "../crates/lctrl-hal-win", version = "1.0.0" }
