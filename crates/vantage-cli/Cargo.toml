[package]
name = "vantage-cli-lib"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
repository.workspace = true
homepage = "https://github.com/cyjin-yl/vantage-cli"
description = "Command-line surface for Vantage hardware control"
license = "AGPL-3.0-only"

[lib]
name = "vantage_cli"
path = "src/lib.rs"


[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
lctrl-core = { path = "../lctrl-core", version = "1.0.0" }
lctrl-hal = { path = "../lctrl-hal", version = "1.0.0" }
lctrl-tune = { path = "../lctrl-tune", version = "1.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
parking_lot.workspace = true
