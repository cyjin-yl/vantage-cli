[package]
name = "vantage-gui"
version = "1.1.1"
edition = "2024"
rust-version = "1.85"
repository.workspace = true
homepage = "https://github.com/cyjin-yl/vantage-cli"
description = "Read-only GPUI dashboard for Vantage"
license = "AGPL-3.0-only"


[dependencies]
gpui = { version = "=0.2.2", default-features = true, features = ["wayland", "x11"] }
lenovo-laptop-control-core = { path = "../lenovo-laptop-control-core", version = "1.1.1" }
lenovo-laptop-control-hal = { path = "../lenovo-laptop-control-hal", version = "1.1.1" }
idna_adapter = { version = "=1.2.0" }


[target.'cfg(target_os = "linux")'.dependencies]
lenovo-laptop-control-hal-linux = { path = "../lenovo-laptop-control-hal-linux", version = "1.1.1" }

[target.'cfg(windows)'.dependencies]
lenovo-laptop-control-hal-win = { path = "../lenovo-laptop-control-hal-win", version = "1.1.1" }