[package]
name = "vantage-daemon"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage = "https://github.com/cyjin-yl/vantage-cli"
description = "Optional local event daemon for Vantage hardware control"
license = "AGPL-3.0-only"


[lib]
name = "vantage_daemon"

[[bin]]
name = "vantaged"
path = "src/main.rs"

[dependencies]
lctrl-core = { path = "../lctrl-core", version = "1.0.0" }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
lctrl-hal = { path = "../lctrl-hal", version = "1.0.0" }
lctrl-hal-linux = { path = "../lctrl-hal-linux", version = "1.0.0" }

[target.'cfg(windows)'.dependencies]
lctrl-hal = { path = "../lctrl-hal", version = "1.0.0" }
lctrl-hal-win = { path = "../lctrl-hal-win", version = "1.0.0" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
